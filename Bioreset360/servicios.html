<!DOCTYPE html>

<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

<script type="text/babel">
const SAGE='#5c7a5f';

const NavBar=()=>{

    <nav style={{position:'sticky',top:0,zIndex:100,background:'rgba(250,248,245,0.95)',backdropFilter:'blur(16px)',WebkitBackdropFilter:'blur(16px)',borderBottom:'1px solid #e0d8d0',height:68,display:'flex',alignItems:'center',padding:'0 48px',gap:40}}>
      <a href="index.html" style={{flexShrink:0}}>
        <div style={{display:'flex',alignItems:'baseline',gap:2}}><span style={{fontFamily:'var(--f-serif)',fontSize:21,fontWeight:500,color:'#1c1812'}}>BioReset</span><span style={{fontFamily:'var(--f-serif)',fontSize:21,fontWeight:400,color:SAGE}}>360</span></div>
        <div style={{fontFamily:'var(--f-sans)',fontSize:9,fontWeight:500,letterSpacing:'1.4px',textTransform:'uppercase',color:'#8a8278',lineHeight:1,marginTop:1}}>Enfoque 360</div>
      </a>
      <div style={{display:'flex',gap:2,flex:1}}>
        {links.map(lk=><a key={lk.l} href={lk.h} style={{fontFamily:'var(--f-sans)',fontSize:14,fontWeight:400,color:lk.l==='Servicios'?SAGE:'#3d3530',padding:'8px 14px',borderRadius:8,borderBottom:lk.l==='Servicios'?`2px solid ${SAGE}`:'2px solid transparent'}}>{lk.l}</a>)}
      </div>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <a href="#" style={{fontFamily:'var(--f-sans)',fontSize:14,color:'#3d3530',padding:'8px 12px'}}>Ingresar</a>
        <a href="agendar.html" style={{fontFamily:'var(--f-sans)',fontSize:14,fontWeight:500,color:'#fff',padding:'10px 22px',borderRadius:12,background:SAGE}}>Agendar Cita</a>
      </div>

/* ── PAGE HEADER ──────────────────────────────── */
const Header=()=>(

    <div style={{maxWidth:1200,margin:'0 auto'}}>
      <div style={{maxWidth:640}}>
        <div style={{fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,letterSpacing:'2px',textTransform:'uppercase',color:'#8a8278',marginBottom:16}}>Servicios terapéuticos</div>
        <h1 style={{fontFamily:'var(--f-serif)',fontSize:56,fontWeight:400,color:'#1c1812',lineHeight:1.08,marginBottom:24}}>Nuestro universo<br/><em style={{fontStyle:'italic',fontWeight:400}}>de sanación</em></h1>
        <p style={{fontFamily:'var(--f-sans)',fontSize:17,fontWeight:300,lineHeight:1.8,color:'#3d3530',maxWidth:500,marginBottom:40}}>Siete modalidades terapéuticas integradas para abordar el bienestar desde todas las dimensiones del ser: clínica, energética, vibracional y sensorial.</p>
        <div style={{display:'flex',gap:12}}>
          <a href="triaje.html" style={{fontFamily:'var(--f-sans)',fontSize:14,fontWeight:500,color:'#fff',padding:'13px 28px',borderRadius:12,background:SAGE,display:'inline-flex',alignItems:'center',gap:6}}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 6.5h9M7 3l3.5 3.5L7 10" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            ¿Cuál es para mí?
          </a>
          <a href="agendar.html" style={{fontFamily:'var(--f-sans)',fontSize:14,color:SAGE,padding:'13px 24px',borderRadius:12,border:`1.5px solid ${SAGE}`}}>Agendar ahora</a>
        </div>
      </div>
    </div>
  </section>
);

/* ── SERVICES GRID ────────────────────────────── */
const ServicesGrid=()=>{
  const [open,setOpen]=React.useState(null);
  const services=[

     para:['Evaluación diagnóstica profunda','Plan terapéutico personalizado','Técnicas de regulación emocional','Psicoeducación y recursos entre sesiones'],
     icon:<svg viewBox="0 0 32 32" fill="none" width="24" height="24"><circle cx="16" cy="11" r="5" stroke="currentColor" strokeWidth="1.5" fill="none"/><path d="M6 28c0-7 20-7 20 0" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"/></svg>},
    {id:'flores',name:'Flores de Bach',tag:'Equilibrio vibracional floral',dur:'60 min',price:'180.000',col:'#d9a441',bg:'#fdf5e4',cat:'Energética',
     desc:'Sistema terapéutico basado en esencias florales desarrollado por el Dr. Edward Bach. Actúa sobre los estados emocionales negativos desde el campo vibracional, sin contraindicaciones.',
     para:['Diagnóstico floral personalizado','38 esencias disponibles','Fórmulas individualizadas','Compatible con cualquier tratamiento'],
     icon:<svg viewBox="0 0 32 32" fill="none" width="24" height="24"><circle cx="16" cy="16" r="3" fill="currentColor" opacity="0.6"/><ellipse cx="16" cy="8" rx="2.5" ry="4" fill="currentColor" opacity="0.4"/><ellipse cx="16" cy="24" rx="2.5" ry="4" fill="currentColor" opacity="0.4"/><ellipse cx="8" cy="16" rx="4" ry="2.5" fill="currentColor" opacity="0.4"/><ellipse cx="24" cy="16" rx="4" ry="2.5" fill="currentColor" opacity="0.4"/></svg>},

    {id:'mindfulness',name:'Mindfulness y Meditación',tag:'Presencia y atención plena',dur:'60 min',price:'170.000',col:SAGE,bg:'#e6ede7',cat:'Contemplativa',
     desc:'Entrenamiento en prácticas de atención plena basadas en el protocolo MBSR (Mindfulness-Based Stress Reduction) de Jon Kabat-Zinn, adaptadas a la realidad del paciente.',

  return(
    <section style={{background:'#fff',padding:'0 48px 96px'}}>
      <div style={{maxWidth:1200,margin:'0 auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:20}}>
          {services.map(s=>{
            const isOpen=open===s.id;

              <div key={s.id}

                style={{borderRadius:22,background:isOpen?s.col:'#faf8f5',border:`1px solid ${isOpen?s.col:'#e0d8d0'}`,padding:'32px 28px',cursor:'pointer',transition:'all .3s ease',transform:isOpen?'translateY(-4px)':'none',boxShadow:isOpen?`0 20px 48px ${s.col}28`:'0 2px 8px rgba(0,0,0,.04)',position:'relative',overflow:'hidden'}}>

                <p style={{fontFamily:'var(--f-sans)',fontSize:13,fontStyle:'italic',color:isOpen?'rgba(255,255,255,.6)':'#8a8278',marginBottom:16}}>{s.tag}</p>
                {/* Desc */}
                <p style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:300,lineHeight:1.65,color:isOpen?'rgba(255,255,255,.78)':'#3d3530',marginBottom:isOpen?20:24,transition:'color .3s'}}>{s.desc}</p>
                {/* Expanded detail */}
                {isOpen&&(
                  <div style={{borderTop:'1px solid rgba(255,255,255,.15)',paddingTop:16,marginBottom:20}}>
                    {s.para.map((p,i)=>(
                      <div key={i} style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:8}}>
                        <span style={{color:'rgba(255,255,255,.7)',fontSize:13,flexShrink:0}}>✓</span>

                      </div>

                  </div>
                )}

                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontFamily:'var(--f-sans)',fontSize:10.5,color:isOpen?'rgba(255,255,255,.45)':'#8a8278',marginBottom:2}}>Desde</div>
                    <div style={{fontFamily:'var(--f-serif)',fontSize:20,fontWeight:500,color:isOpen?'#fff':s.col}}>${s.price} COP</div>
                  </div>
                  <a href="agendar.html" onClick={e=>e.stopPropagation()} style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:500,padding:'10px 18px',borderRadius:10,background:isOpen?'rgba(255,255,255,.18)':'transparent',color:isOpen?'#fff':s.col,border:isOpen?'1px solid rgba(255,255,255,.25)':`1px solid ${s.col}`,display:'inline-flex',alignItems:'center',gap:6}}>
                    Agendar
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M7 3l3 3-3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </a>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
};

          <div key={i} style={{padding:'0 32px',borderRight:i<3?'1px solid rgba(28,24,18,.1)':'none',position:'relative'}}>
            <div style={{fontFamily:'var(--f-serif)',fontSize:48,fontWeight:400,color:'rgba(92,122,95,.2)',lineHeight:1,marginBottom:16}}>{s.n}</div>
            <h3 style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:500,color:'#1c1812',marginBottom:10}}>{s.t}</h3>
            <p style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:300,color:'#8a8278',lineHeight:1.65}}>{s.s}</p>
            {i===0&&<a href="triaje.html" style={{display:'inline-flex',alignItems:'center',gap:4,marginTop:14,fontFamily:'var(--f-sans)',fontSize:12,fontWeight:500,color:SAGE}}>Hacer cuestionario →</a>}
            {i===1&&<a href="agendar.html" style={{display:'inline-flex',alignItems:'center',gap:4,marginTop:14,fontFamily:'var(--f-sans)',fontSize:12,fontWeight:500,color:SAGE}}>Agendar gratis →</a>}

      <div style={{borderRadius:24,background:'linear-gradient(135deg,#1c1812 0%,#3d2e1e 100%)',padding:'56px 64px',display:'flex',justifyContent:'space-between',alignItems:'center',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',right:-60,top:-60,width:320,height:320,borderRadius:'50%',background:'rgba(245,233,212,.05)'}}/>
        <div style={{position:'absolute',left:'40%',bottom:-80,width:200,height:200,borderRadius:'50%',background:'rgba(92,122,95,.08)'}}/>

          <div style={{fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,letterSpacing:'2px',textTransform:'uppercase',color:'rgba(245,233,212,.45)',marginBottom:14}}>¿No sabes por dónde empezar?</div>

const Footer=()=>(
  <footer style={{background:'#1c1812',padding:'48px 48px 28px'}}>
    <div style={{maxWidth:1200,margin:'0 auto',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid rgba(245,233,212,.07)',paddingBottom:24}}>
      <div style={{display:'flex',alignItems:'baseline',gap:2}}><span style={{fontFamily:'var(--f-serif)',fontSize:20,fontWeight:500,color:'#f5e9d4'}}>BioReset</span><span style={{fontFamily:'var(--f-serif)',fontSize:20,fontWeight:400,color:SAGE}}>360</span></div>
