<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agendar Cita · BioReset360</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:opsz,wght@14..32,300..600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,sans-serif;background:#faf8f5;color:#1c1812;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit;cursor:pointer}
input,textarea{font-family:'Inter',-apple-system,sans-serif}
:root{--f-serif:'Playfair Display',Georgia,serif;--f-sans:'Inter',-apple-system,sans-serif;--sage:#5c7a5f;--sage-l:#e6ede7;--terra:#c0774e;--cream:#f5e9d4;--border:#e0d8d0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const SAGE='#5c7a5f';

/* ── NAV ──────────────────────────────────────── */
const Nav=()=>(
  <nav style={{position:'fixed',top:0,left:0,right:0,zIndex:100,background:'rgba(250,248,245,0.96)',backdropFilter:'blur(16px)',WebkitBackdropFilter:'blur(16px)',borderBottom:'1px solid #e0d8d0',height:64,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 48px'}}>
    <a href="index.html" style={{display:'flex',alignItems:'baseline',gap:2}}>
      <span style={{fontFamily:'var(--f-serif)',fontSize:19,fontWeight:500,color:'#1c1812'}}>BioReset</span>
      <span style={{fontFamily:'var(--f-serif)',fontSize:19,fontWeight:400,color:SAGE}}>360</span>
    </a>
    <a href="index.html" style={{fontFamily:'var(--f-sans)',fontSize:13,color:'#8a8278',display:'flex',alignItems:'center',gap:4}}>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M10 7H1M5 3L1 7l4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
      Volver al inicio
    </a>
  </nav>
);

/* ── STEP INDICATOR ───────────────────────────── */
const StepIndicator=({step,total})=>(
  <div style={{display:'flex',alignItems:'center',gap:0,justifyContent:'center',marginBottom:48}}>
    {Array.from({length:total}).map((_,i)=>(
      <React.Fragment key={i}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}>
          <div style={{width:32,height:32,borderRadius:'50%',background:i<step?SAGE:i===step?'#fff':'#fff',border:i<step?`2px solid ${SAGE}`:i===step?`2px solid ${SAGE}`:'2px solid #e0d8d0',display:'flex',alignItems:'center',justifyContent:'center',transition:'all .3s'}}>
            {i<step?(
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 4" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            ):(
              <span style={{fontFamily:'var(--f-sans)',fontSize:12,fontWeight:500,color:i===step?SAGE:'#8a8278'}}>{i+1}</span>
            )}
          </div>
          <span style={{fontFamily:'var(--f-sans)',fontSize:10.5,fontWeight:500,color:i===step?SAGE:'#8a8278',whiteSpace:'nowrap'}}>
            {['Servicio','Fecha','Hora','Tus datos'][i]}
          </span>
        </div>
        {i<total-1&&<div style={{width:48,height:2,background:i<step?SAGE:'#e0d8d0',marginBottom:22,transition:'background .3s'}}/>}
      </React.Fragment>
    ))}
  </div>
);

/* ── STEP 1: SERVICE ──────────────────────────── */
const ServiceStep=({value,onChange,onNext})=>{
  const services=[
    {id:'inicial',name:'Consulta Inicial',sub:'Primera sesión de evaluación',dur:'60 min',col:'#c0774e',bg:'#f5e8df',icon:<svg viewBox="0 0 28 28" fill="none" width="22" height="22"><circle cx="14" cy="10" r="4" stroke="currentColor" strokeWidth="1.4" fill="none"/><path d="M7 24c0-6 14-6 14 0" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" fill="none"/></svg>},
    {id:'psicologia',name:'Psicología Individual',sub:'Sesión de seguimiento',dur:'60 min',col:SAGE,bg:'#e6ede7',icon:<svg viewBox="0 0 28 28" fill="none" width="22" height="22"><circle cx="14" cy="14" r="8" stroke="currentColor" strokeWidth="1.4" fill="none"/><path d="M14 10v4l3 3" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>},
    {id:'flores',name:'Flores de Bach',sub:'Terapia vibracional floral',dur:'60 min',col:'#d9a441',bg:'#fdf5e4',icon:<svg viewBox="0 0 28 28" fill="none" width="22" height="22"><circle cx="14" cy="14" r="3" fill="currentColor" opacity="0.6"/><ellipse cx="14" cy="7" rx="2" ry="3.5" fill="currentColor" opacity="0.4"/><ellipse cx="14" cy="21" rx="2" ry="3.5" fill="currentColor" opacity="0.4"/><ellipse cx="7" cy="14" rx="3.5" ry="2" fill="currentColor" opacity="0.4"/><ellipse cx="21" cy="14" rx="3.5" ry="2" fill="currentColor" opacity="0.4"/></svg>},
    {id:'binaural',name:'Sonido Binaural',sub:'Sincronización hemisférica',dur:'75 min',col:'#5762a8',bg:'#eaecf6',icon:<svg viewBox="0 0 28 28" fill="none" width="22" height="22"><path d="M2 14Q5 7 8 14Q11 21 14 14Q17 7 20 14Q23 21 26 14" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" fill="none"/></svg>},
    {id:'cromo',name:'Cromoterapia',sub:'Equilibrio lumínico-energético',dur:'50 min',col:'#c0774e',bg:'#f5e8df',icon:<svg viewBox="0 0 28 28" fill="none" width="22" height="22"><circle cx="14" cy="14" r="5" stroke="currentColor" strokeWidth="1.5" fill="none"/><circle cx="14" cy="14" r="9" stroke="currentColor" strokeWidth="1" fill="none" opacity="0.45"/></svg>},
    {id:'mindfulness',name:'Mindfulness',sub:'Atención plena y presencia',dur:'60 min',col:SAGE,bg:'#e6ede7',icon:<svg viewBox="0 0 28 28" fill="none" width="22" height="22"><circle cx="14" cy="9" r="3.5" stroke="currentColor" strokeWidth="1.4" fill="none"/><path d="M7 24c0-5.5 14-5.5 14 0" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" fill="none"/><path d="M11 15c0-2 6-2 6 0" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" fill="none" opacity="0.5"/></svg>},
  ];
  return(
    <div>
      <div style={{textAlign:'center',marginBottom:36}}>
        <h2 style={{fontFamily:'var(--f-serif)',fontSize:34,fontWeight:400,color:'#1c1812',lineHeight:1.2,marginBottom:10}}>¿Qué tipo de sesión buscas?</h2>
        <p style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:300,color:'#8a8278'}}>Selecciona el servicio que más resuena con tu momento</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14,marginBottom:36}}>
        {services.map(s=>{
          const on=value===s.id;
          return(
            <button key={s.id} onClick={()=>onChange(s.id)}
              style={{display:'flex',flexDirection:'column',gap:14,padding:'24px 22px',borderRadius:18,background:on?s.col:'#fff',border:`1.5px solid ${on?s.col:s.bg}`,cursor:'pointer',textAlign:'left',transition:'all .25s',boxShadow:on?`0 12px 32px ${s.col}28`:'none'}}>
              <div style={{color:on?'rgba(255,255,255,.9)':s.col,width:22,height:22}}>{s.icon}</div>
              <div>
                <div style={{fontFamily:'var(--f-sans)',fontSize:14,fontWeight:500,color:on?'#fff':'#1c1812',marginBottom:4}}>{s.name}</div>
                <div style={{fontFamily:'var(--f-sans)',fontSize:12,fontWeight:300,color:on?'rgba(255,255,255,.65)':'#8a8278',marginBottom:6}}>{s.sub}</div>
                <div style={{fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,color:on?'rgba(255,255,255,.55)':s.col,background:on?'rgba(255,255,255,.12)':s.bg,display:'inline-block',padding:'2px 8px',borderRadius:999}}>{s.dur}</div>
              </div>
            </button>
          );
        })}
      </div>
      <div style={{textAlign:'center'}}>
        <button onClick={onNext} disabled={!value} style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:500,color:'#fff',padding:'14px 40px',borderRadius:12,background:value?SAGE:'#e0d8d0',border:'none',cursor:value?'pointer':'default',transition:'background .25s'}}>
          Continuar →
        </button>
      </div>
    </div>
  );
};

/* ── STEP 2: DATE ─────────────────────────────── */
const DateStep=({value,onChange,onNext,onBack})=>{
  const [month,setMonth]=React.useState(0); // 0=mayo,1=junio
  const months=[
    {name:'Mayo 2026',days:31,startPad:4,taken:[13,20,26],past:[1,2,3,4,5,6,7,8]},
    {name:'Junio 2026',days:30,startPad:0,taken:[3,11,17,24],past:[]},
  ];
  const m=months[month];
  const weekends=[];
  // Calculate weekends for each month
  // May: startPad=4 (first day = Fri), days 2,3,9,10,16,17,23,24,30,31
  const mayWeekends=[2,3,9,10,16,17,23,24,30,31];
  // June: startPad=0 (first day = Mon), days 6,7,13,14,20,21,27,28
  const junWeekends=[6,7,13,14,20,21,27,28];
  const currentWeekends=month===0?mayWeekends:junWeekends;

  const isAvailable=(d)=>!currentWeekends.includes(d)&&!m.taken.includes(d)&&!m.past.includes(d)&&d>=1&&d<=m.days;
  const isTaken=(d)=>m.taken.includes(d)&&!m.past.includes(d);
  const isPast=(d)=>m.past.includes(d);
  const isWeekend=(d)=>currentWeekends.includes(d);

  const cells=[];
  for(let i=0;i<m.startPad;i++)cells.push(null);
  for(let d=1;d<=m.days;d++)cells.push(d);

  return(
    <div>
      <div style={{textAlign:'center',marginBottom:36}}>
        <h2 style={{fontFamily:'var(--f-serif)',fontSize:34,fontWeight:400,color:'#1c1812',marginBottom:10}}>Elige tu fecha</h2>
        <p style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:300,color:'#8a8278'}}>Selecciona el día que mejor se adapte a ti</p>
      </div>
      <div style={{maxWidth:420,margin:'0 auto',background:'#fff',borderRadius:20,padding:'28px',border:'1px solid #e0d8d0'}}>
        {/* Month navigation */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
          <button onClick={()=>{if(month>0){setMonth(m=>m-1);onChange(null);}}} style={{width:34,height:34,borderRadius:10,border:'1px solid #e0d8d0',background:'#fff',cursor:month>0?'pointer':'default',opacity:month>0?1:0.3,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="#3d3530" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <span style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:500,color:'#1c1812'}}>{m.name}</span>
          <button onClick={()=>{if(month<1){setMonth(m=>m+1);onChange(null);}}} style={{width:34,height:34,borderRadius:10,border:'1px solid #e0d8d0',background:'#fff',cursor:month<1?'pointer':'default',opacity:month<1?1:0.3,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2l5 5-5 5" stroke="#3d3530" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
        </div>
        {/* Day headers */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,marginBottom:8}}>
          {['L','M','X','J','V','S','D'].map(d=><div key={d} style={{textAlign:'center',fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,color:'#8a8278',padding:'4px 0'}}>{d}</div>)}
        </div>
        {/* Days grid */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4}}>
          {cells.map((d,i)=>{
            if(!d)return<div key={`e${i}`}/>;
            const avail=isAvailable(d);
            const taken=isTaken(d);
            const past=isPast(d);
            const weekend=isWeekend(d);
            const sel=value&&value.day===d&&value.month===month;
            return(
              <button key={d} onClick={avail?()=>onChange({day:d,month,monthName:m.name}):undefined}
                style={{
                  aspectRatio:'1',padding:0,borderRadius:8,border:'none',
                  background:sel?SAGE:avail?'transparent':'transparent',
                  color:sel?'#fff':past||weekend?'#ccc':taken?'#ddd':'#1c1812',
                  fontFamily:'var(--f-sans)',fontSize:13,
                  fontWeight:sel?500:400,
                  cursor:avail?'pointer':'default',
                  textDecoration:taken?'line-through':'none',
                  position:'relative',
                }}>
                {d}
                {avail&&!sel&&<div style={{position:'absolute',bottom:3,left:'50%',transform:'translateX(-50%)',width:4,height:4,borderRadius:'50%',background:SAGE}}/>}
              </button>
            );
          })}
        </div>
        <div style={{marginTop:20,paddingTop:16,borderTop:'1px solid #e0d8d0',display:'flex',gap:16,alignItems:'center'}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:8,height:8,borderRadius:'50%',background:SAGE}}/><span style={{fontFamily:'var(--f-sans)',fontSize:11,color:'#8a8278'}}>Disponible</span></div>
          <div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:8,height:8,borderRadius:'50%',background:'#e0d8d0'}}/><span style={{fontFamily:'var(--f-sans)',fontSize:11,color:'#8a8278'}}>No disponible</span></div>
        </div>
      </div>
      <div style={{display:'flex',justifyContent:'center',gap:12,marginTop:36}}>
        <button onClick={onBack} style={{fontFamily:'var(--f-sans)',fontSize:15,color:'#8a8278',padding:'14px 28px',borderRadius:12,background:'transparent',border:'1px solid #e0d8d0',cursor:'pointer'}}>← Volver</button>
        <button onClick={onNext} disabled={!value} style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:500,color:'#fff',padding:'14px 40px',borderRadius:12,background:value?SAGE:'#e0d8d0',border:'none',cursor:value?'pointer':'default',transition:'background .25s'}}>Continuar →</button>
      </div>
    </div>
  );
};

/* ── STEP 3: TIME ─────────────────────────────── */
const TimeStep=({date,value,onChange,onNext,onBack})=>{
  const slots=[{t:'08:00',taken:false},{t:'09:00',taken:true},{t:'10:00',taken:false},{t:'11:00',taken:false},{t:'14:00',taken:true},{t:'15:00',taken:false},{t:'16:00',taken:false},{t:'17:00',taken:false}];
  return(
    <div>
      <div style={{textAlign:'center',marginBottom:36}}>
        <h2 style={{fontFamily:'var(--f-serif)',fontSize:34,fontWeight:400,color:'#1c1812',marginBottom:10}}>Elige tu horario</h2>
        <p style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:300,color:'#8a8278'}}>{date?.monthName} {date?.day}, 2026</p>
      </div>
      <div style={{maxWidth:380,margin:'0 auto'}}>
        <div style={{fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,letterSpacing:'1.5px',textTransform:'uppercase',color:'#8a8278',marginBottom:14}}>Mañana</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:28}}>
          {slots.slice(0,4).map(s=>{
            const sel=value===s.t;
            return<button key={s.t} onClick={s.taken?undefined:()=>onChange(s.t)} style={{padding:'14px 8px',borderRadius:12,border:`1.5px solid ${sel?SAGE:s.taken?'#f0ece8':'#e0d8d0'}`,background:sel?SAGE:'#fff',color:sel?'#fff':s.taken?'#ccc':'#1c1812',fontFamily:'var(--f-sans)',fontSize:14,fontWeight:sel?500:400,cursor:s.taken?'default':'pointer',textDecoration:s.taken?'line-through':'none',transition:'all .2s'}}>{s.t}</button>;
          })}
        </div>
        <div style={{fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,letterSpacing:'1.5px',textTransform:'uppercase',color:'#8a8278',marginBottom:14}}>Tarde</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
          {slots.slice(4).map(s=>{
            const sel=value===s.t;
            return<button key={s.t} onClick={s.taken?undefined:()=>onChange(s.t)} style={{padding:'14px 8px',borderRadius:12,border:`1.5px solid ${sel?SAGE:s.taken?'#f0ece8':'#e0d8d0'}`,background:sel?SAGE:'#fff',color:sel?'#fff':s.taken?'#ccc':'#1c1812',fontFamily:'var(--f-sans)',fontSize:14,fontWeight:sel?500:400,cursor:s.taken?'default':'pointer',textDecoration:s.taken?'line-through':'none',transition:'all .2s'}}>{s.t}</button>;
          })}
        </div>
      </div>
      <div style={{display:'flex',justifyContent:'center',gap:12,marginTop:40}}>
        <button onClick={onBack} style={{fontFamily:'var(--f-sans)',fontSize:15,color:'#8a8278',padding:'14px 28px',borderRadius:12,background:'transparent',border:'1px solid #e0d8d0',cursor:'pointer'}}>← Volver</button>
        <button onClick={onNext} disabled={!value} style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:500,color:'#fff',padding:'14px 40px',borderRadius:12,background:value?SAGE:'#e0d8d0',border:'none',cursor:value?'pointer':'default',transition:'background .25s'}}>Continuar →</button>
      </div>
    </div>
  );
};

/* ── STEP 4: CONTACT FORM ─────────────────────── */
const ContactStep=({booking,onSubmit,onBack})=>{
  const [form,setForm]=React.useState({name:'',email:'',phone:'',note:''});
  const [errors,setErrors]=React.useState({});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const validate=()=>{
    const e={};
    if(!form.name.trim()||form.name.length<2)e.name='Ingresa tu nombre completo';
    if(!form.email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/))e.email='Email no válido';
    if(!form.phone.match(/^\d{7,}$/))e.phone='Teléfono no válido (solo números)';
    setErrors(e);
    return Object.keys(e).length===0;
  };
  const handleSubmit=()=>{if(validate())onSubmit(form);};

  const inputStyle=(err)=>({width:'100%',fontFamily:'var(--f-sans)',fontSize:14,color:'#1c1812',padding:'13px 16px',borderRadius:10,border:`1.5px solid ${err?'#c0774e':'#e0d8d0'}`,background:'#fff',outline:'none',boxSizing:'border-box'});
  const labelStyle={fontFamily:'var(--f-sans)',fontSize:12,fontWeight:500,color:'#3d3530',marginBottom:6,display:'block',letterSpacing:'0.2px'};
  const errStyle={fontFamily:'var(--f-sans)',fontSize:11,color:'#c0774e',marginTop:4};

  return(
    <div>
      <div style={{textAlign:'center',marginBottom:36}}>
        <h2 style={{fontFamily:'var(--f-serif)',fontSize:34,fontWeight:400,color:'#1c1812',marginBottom:10}}>Tus datos</h2>
        <p style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:300,color:'#8a8278'}}>Para confirmar tu cita y enviarte los detalles</p>
      </div>

      {/* Booking summary */}
      <div style={{maxWidth:480,margin:'0 auto 32px',background:'#f5e9d4',borderRadius:14,padding:'20px 24px',display:'flex',gap:20,alignItems:'center'}}>
        <div style={{flex:1}}>
          <div style={{fontFamily:'var(--f-sans)',fontSize:12,color:'#8a8278',marginBottom:4}}>Tu cita</div>
          <div style={{fontFamily:'var(--f-sans)',fontSize:14,fontWeight:500,color:'#1c1812'}}>{booking.service?.replace('inicial','Consulta Inicial').replace('psicologia','Psicología Individual').replace('flores','Flores de Bach').replace('binaural','Sonido Binaural').replace('cromo','Cromoterapia').replace('mindfulness','Mindfulness')}</div>
          <div style={{fontFamily:'var(--f-sans)',fontSize:13,color:'#8a8278',marginTop:2}}>{booking.date?.monthName} {booking.date?.day} · {booking.time}</div>
        </div>
        <div style={{fontFamily:'var(--f-sans)',fontSize:11,color:'#5c7a5f',background:'#e6ede7',padding:'4px 10px',borderRadius:999,fontWeight:500}}>Confirmado</div>
      </div>

      <div style={{maxWidth:480,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}>
        <div>
          <label style={labelStyle}>Nombre completo *</label>
          <input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Tu nombre" style={inputStyle(errors.name)}/>
          {errors.name&&<div style={errStyle}>{errors.name}</div>}
        </div>
        <div>
          <label style={labelStyle}>Correo electrónico *</label>
          <input type="email" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="correo@ejemplo.com" style={inputStyle(errors.email)}/>
          {errors.email&&<div style={errStyle}>{errors.email}</div>}
        </div>
        <div>
          <label style={labelStyle}>Teléfono / WhatsApp *</label>
          <input type="tel" value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="3001234567" style={inputStyle(errors.phone)}/>
          {errors.phone&&<div style={errStyle}>{errors.phone}</div>}
        </div>
        <div>
          <label style={labelStyle}>¿Hay algo que quieras compartir antes de la sesión? <span style={{fontWeight:300,color:'#8a8278'}}>(opcional)</span></label>
          <textarea value={form.note} onChange={e=>set('note',e.target.value)} placeholder="Cuéntanos brevemente lo que deseas trabajar..." rows={4} style={{...inputStyle(false),resize:'none',lineHeight:1.6}}/>
        </div>
        <p style={{fontFamily:'var(--f-sans)',fontSize:12,fontWeight:300,color:'#8a8278',lineHeight:1.6}}>Tu información es completamente confidencial y solo será usada para gestionar tu cita.</p>
      </div>

      <div style={{display:'flex',justifyContent:'center',gap:12,marginTop:36}}>
        <button onClick={onBack} style={{fontFamily:'var(--f-sans)',fontSize:15,color:'#8a8278',padding:'14px 28px',borderRadius:12,background:'transparent',border:'1px solid #e0d8d0',cursor:'pointer'}}>← Volver</button>
        <button onClick={handleSubmit} style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:500,color:'#fff',padding:'14px 40px',borderRadius:12,background:SAGE,border:'none',cursor:'pointer'}}>Confirmar cita →</button>
      </div>
    </div>
  );
};

/* ── SUCCESS SCREEN ───────────────────────────── */
const SuccessScreen=({booking})=>(
  <div style={{minHeight:'80vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'40px 24px',textAlign:'center'}}>
    <div style={{maxWidth:500}}>
      <div style={{width:80,height:80,borderRadius:28,background:'#e6ede7',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 28px'}}>
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="16" stroke={SAGE} strokeWidth="1.5" fill="none"/><path d="M13 20l5 5 9-10" stroke={SAGE} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </div>
      <div style={{fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,letterSpacing:'2px',textTransform:'uppercase',color:'#8a8278',marginBottom:14}}>Cita confirmada</div>
      <h2 style={{fontFamily:'var(--f-serif)',fontSize:38,fontWeight:400,color:'#1c1812',lineHeight:1.15,marginBottom:16}}>¡Nos vemos pronto, {booking.contact?.name?.split(' ')[0]}!</h2>
      <p style={{fontFamily:'var(--f-sans)',fontSize:15,fontWeight:300,color:'#8a8278',lineHeight:1.8,marginBottom:36}}>Te enviamos los detalles de tu cita a <strong style={{color:'#1c1812'}}>{booking.contact?.email}</strong> y un recordatorio 24 horas antes.</p>

      <div style={{background:'#fff',borderRadius:20,padding:'28px 32px',border:'1px solid #e0d8d0',marginBottom:36,textAlign:'left'}}>
        <div style={{fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,letterSpacing:'1.5px',textTransform:'uppercase',color:'#8a8278',marginBottom:16}}>Resumen de tu cita</div>
        {[['Servicio',booking.service],['Fecha',`${booking.date?.monthName} ${booking.date?.day}, 2026`],['Hora',booking.time],['Modalidad','Presencial · Bogotá, Colombia']].map(([k,v])=>(
          <div key={k} style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingBottom:12,marginBottom:12,borderBottom:'1px solid #f0ece8'}}>
            <span style={{fontFamily:'var(--f-sans)',fontSize:13,color:'#8a8278'}}>{k}</span>
            <span style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:500,color:'#1c1812'}}>{v}</span>
          </div>
        ))}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span style={{fontFamily:'var(--f-sans)',fontSize:13,color:'#8a8278'}}>Código de reserva</span>
          <span style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:600,color:SAGE,letterSpacing:'1px'}}>BR-{Math.floor(Math.random()*9000+1000)}</span>
        </div>
      </div>

      <div style={{background:'#f5e9d4',borderRadius:14,padding:'18px 24px',marginBottom:36,textAlign:'left'}}>
        <div style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:500,color:'#1c1812',marginBottom:4}}>¿Necesitas cancelar o reagendar?</div>
        <div style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:300,color:'#8a8278'}}>Escríbenos con al menos 24 horas de anticipación a hola@bioreset360.co o llama al +57 (1) 234-5678.</div>
      </div>

      <a href="index.html" style={{display:'inline-flex',alignItems:'center',gap:6,fontFamily:'var(--f-sans)',fontSize:14,fontWeight:500,color:SAGE}}>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M10 7H1M5 3L1 7l4 4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        Volver al inicio
      </a>
    </div>
  </div>
);

/* ── APP CONTROLLER ───────────────────────────── */
const SERVICES={inicial:'Consulta Inicial',psicologia:'Psicología Individual',flores:'Flores de Bach',binaural:'Sonido Binaural',cromo:'Cromoterapia',mindfulness:'Mindfulness'};
const App=()=>{
  const [step,setStep]=React.useState(0);
  const [visible,setVisible]=React.useState(true);
  const [service,setService]=React.useState(null);
  const [date,setDate]=React.useState(null);
  const [time,setTime]=React.useState(null);
  const [contact,setContact]=React.useState(null);

  const go=(n)=>{
    setVisible(false);
    setTimeout(()=>{setStep(n);setVisible(true);},280);
  };

  const booking={service:service?SERVICES[service]:null,date,time,contact};

  return(
    <div style={{background:'#faf8f5',minHeight:'100vh'}}>
      <Nav/>
      <div style={{paddingTop:64}}>
        {step<4?(
          <div style={{maxWidth:800,margin:'0 auto',padding:'60px 24px'}}>
            {step<4&&<StepIndicator step={step} total={4}/>}
            <div style={{opacity:visible?1:0,transform:visible?'none':'translateY(10px)',transition:'all .28s ease'}}>
              {step===0&&<ServiceStep value={service} onChange={setService} onNext={()=>go(1)}/>}
              {step===1&&<DateStep value={date} onChange={setDate} onNext={()=>go(2)} onBack={()=>go(0)}/>}
              {step===2&&<TimeStep date={date} value={time} onChange={setTime} onNext={()=>go(3)} onBack={()=>go(1)}/>}
              {step===3&&<ContactStep booking={booking} onSubmit={(c)=>{setContact(c);go(4);}} onBack={()=>go(2)}/>}
            </div>
          </div>
        ):(
          <SuccessScreen booking={{...booking,contact}}/>
        )}
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
