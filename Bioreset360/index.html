              {p.feat&&<div style={{position:'absolute',top:-1,left:'50%',transform:'translateX(-50%)',background:p.col,color:'#fff',fontFamily:'var(--f-sans)',fontSize:11,fontWeight:500,padding:'6px 20px',borderRadius:'0 0 14px 14px',whiteSpace:'nowrap'}}>Más recomendado</div>}
              <div style={{width:10,height:10,borderRadius:'50%',background:p.col,marginBottom:20}}/>
              <div style={{fontFamily:'var(--f-sans)',fontSize:10.5,fontWeight:600,letterSpacing:'1px',textTransform:'uppercase',color:p.feat?'rgba(245,233,212,.4)':'#8a8278',marginBottom:4}}>Plan</div>
              <h3 style={{fontFamily:'var(--f-serif)',fontSize:28,fontWeight:500,color:p.feat?'#f5e9d4':'#1c1812',marginBottom:6}}>{p.name}</h3>
              <p style={{fontFamily:'var(--f-sans)',fontSize:13,fontStyle:'italic',color:p.feat?'rgba(245,233,212,.45)':'#8a8278',marginBottom:24}}>{p.tag}</p>
              <div style={{marginBottom:4}}><span style={{fontFamily:'var(--f-serif)',fontSize:34,fontWeight:500,color:p.feat?'#f5e9d4':'#1c1812'}}>${p.price}</span></div>
              <div style={{fontFamily:'var(--f-sans)',fontSize:12,color:p.feat?'rgba(245,233,212,.35)':'#8a8278',marginBottom:4}}>{p.per}</div>
              <div style={{fontFamily:'var(--f-sans)',fontSize:12,fontWeight:300,color:p.feat?'rgba(245,233,212,.32)':'#8a8278',paddingBottom:20,marginBottom:20,borderBottom:`1px solid ${p.feat?'rgba(255,255,255,.07)':'#e0d8d0'}`}}>{p.dur}</div>
              <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:28}}>
                {p.items.map((it,i)=>(
                  <div key={i} style={{display:'flex',gap:10,alignItems:'flex-start',opacity:it?1:0.3}}>
                    <span style={{fontSize:13,color:it?p.col:'#8a8278',fontWeight:it?500:400,flexShrink:0}}>{it?'✓':'—'}</span>
                    <span style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:300,color:p.feat?'rgba(245,233,212,.72)':'#3d3530'}}>{it||'No incluido'}</span>
                  </div>
                ))}
              </div>
              <a href="agendar.html" style={{display:'block',textAlign:'center',fontFamily:'var(--f-sans)',fontSize:14,fontWeight:500,color:p.feat?'#1c1812':p.col,padding:'13px 20px',borderRadius:12,background:p.feat?'#f5e9d4':'transparent',border:p.feat?'none':`1.5px solid ${p.col}`}}>{p.cta}</a>
            </div>
          ))}
        </div>
        <p style={{textAlign:'center',marginTop:36,fontFamily:'var(--f-sans)',fontSize:13,fontWeight:300,color:'#8a8278'}}>Evaluación inicial gratuita · Sin compromisos · Cancelación con 24 h de anticipación</p>
      </div>
    </section>
  );
};

const Footer=({th})=>{
  const cols=[{h:'Servicios',ls:['Psicología Clínica','Flores de Bach','Sonido Binaural','Cromoterapia','Reiki']},{h:'Planes',ls:['Plan Essencial','Plan Vital','Plan Premium','Evaluación Gratuita']},{h:'El Terapeuta',ls:['Perfil','Formación','Enfoque Clínico','El Espacio']},{h:'Empresa',ls:['Nosotros','Blog','Cuestionario','Contacto']}];
  return(
    <footer style={{background:'#1c1812',padding:'64px 48px 32px'}}>
      <div style={{maxWidth:1200,margin:'0 auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:56}}>
          <div>
            <div style={{display:'flex',alignItems:'baseline',gap:2,marginBottom:6}}><span style={{fontFamily:'var(--f-serif)',fontSize:22,fontWeight:500,color:'#f5e9d4'}}>BioReset</span><span style={{fontFamily:'var(--f-serif)',fontSize:22,fontWeight:400,color:th.primary}}>360</span></div>
            <div style={{fontFamily:'var(--f-sans)',fontSize:9.5,fontWeight:500,letterSpacing:'1.4px',textTransform:'uppercase',color:'#8a8278',marginBottom:12}}>Enfoque 360</div>
            <p style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:300,color:'rgba(245,233,212,.42)',lineHeight:1.7,maxWidth:220}}>Centro de psicología integrativa en Bogotá.</p>
          </div>
          <a href="agendar.html" style={{fontFamily:'var(--f-sans)',fontSize:14,fontWeight:500,color:'#1c1812',padding:'12px 24px',borderRadius:12,background:'#f5e9d4'}}>Agendar Cita</a>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:24,marginBottom:48}}>
          {cols.map(c=><div key={c.h}><div style={{fontFamily:'var(--f-sans)',fontSize:10,fontWeight:600,letterSpacing:'.8px',textTransform:'uppercase',color:'rgba(245,233,212,.3)',marginBottom:14}}>{c.h}</div><div style={{display:'flex',flexDirection:'column',gap:10}}>{c.ls.map(l=><a key={l} href="#" style={{fontFamily:'var(--f-sans)',fontSize:13,fontWeight:300,color:'rgba(245,233,212,.5)'}}>{l}</a>)}</div></div>)}
        </div>
        <div style={{borderTop:'1px solid rgba(245,233,212,.07)',paddingTop:24,display:'flex',justifyContent:'space-between'}}>
          <div style={{fontFamily:'var(--f-sans)',fontSize:12,color:'rgba(245,233,212,.22)'}}>© 2026 BioReset360. Bogotá, Colombia.</div>
          <div style={{display:'flex',gap:24}}>{['Privacidad','Términos'].map(l=><a key={l} href="#" style={{fontFamily:'var(--f-sans)',fontSize:12,color:'rgba(245,233,212,.22)'}}>{l}</a>)}</div>
        </div>
      </div>
    </footer>
  );
};

const App=()=>{
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const th=THEMES[t.colorTheme]||THEMES.tierra;
  return(
    <div style={{background:'#faf8f5'}}>
      <NavBar th={th}/>
      <Hero th={th}/>
      <Triaje th={th}/>
      <Terapias th={th}/>
      <TerapeutaTeaser th={th}/>
      <Testimonios th={th}/>
      <Pricing th={th}/>
      <Footer th={th}/>
      <TweaksPanel>
        <TweakSection label="Color"/>
        <TweakRadio label="Tema" value={t.colorTheme} options={['tierra','indigo','bosque']} onChange={v=>setTweak('colorTheme',v)}/>
      </TweaksPanel>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
