<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#fff;padding:28px 24px;display:flex;flex-direction:column;gap:20px}
  .section-label{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#9297a0}
  .logo-row{display:flex;gap:16px;align-items:stretch}
  .logo-bg{border-radius:10px;padding:28px 32px;display:flex;align-items:center;justify-content:flex-start;flex:1}
  .wordmark{font-family:'Inter',sans-serif;font-size:28px;line-height:1;letter-spacing:-0.5px;user-select:none}
  .wordmark .bio{font-weight:400}
  .wordmark .rest{font-weight:500}
  .size-row{display:flex;align-items:flex-end;gap:24px}
  .size-item{display:flex;flex-direction:column;gap:6px}
  .size-tag{font-size:10px;color:#9297a0;font-weight:500}
</style>
</head>
<body>

<div class="section-label">Wordmark — on light surfaces</div>
<div class="logo-row">
  <div class="logo-bg" style="background:#fff;border:1px solid #e0e2e6">
    <div class="wordmark" style="color:#181d26"><span class="bio">Bio</span><span class="rest">Reset360</span></div>
  </div>
  <div class="logo-bg" style="background:#f8fafc;border:1px solid #e0e2e6">
    <div class="wordmark" style="color:#181d26"><span class="bio">Bio</span><span class="rest">Reset360</span></div>
  </div>
</div>

<div class="section-label">Wordmark — on signature surfaces</div>
<div class="logo-row">
  <div class="logo-bg" style="background:#aa2d00">
    <div class="wordmark" style="color:#fff"><span class="bio">Bio</span><span class="rest">Reset360</span></div>
  </div>
  <div class="logo-bg" style="background:#0a2e0e">
    <div class="wordmark" style="color:#fff"><span class="bio">Bio</span><span class="rest">Reset360</span></div>
  </div>
  <div class="logo-bg" style="background:#181d26">
    <div class="wordmark" style="color:#fff"><span class="bio">Bio</span><span class="rest">Reset360</span></div>
  </div>
</div>

<div class="section-label">Size scale</div>
<div class="size-row">
  <div class="size-item">
    <div class="size-tag">40px — hero / large</div>
    <div class="wordmark" style="font-size:40px;color:#181d26"><span class="bio">Bio</span><span class="rest">Reset360</span></div>
  </div>
  <div class="size-item">
    <div class="size-tag">28px — nav</div>
    <div class="wordmark" style="font-size:28px;color:#181d26"><span class="bio">Bio</span><span class="rest">Reset360</span></div>
  </div>
  <div class="size-item">
    <div class="size-tag">20px — footer</div>
    <div class="wordmark" style="font-size:20px;color:#181d26"><span class="bio">Bio</span><span class="rest">Reset360</span></div>
  </div>
</div>

</body>
</html>
